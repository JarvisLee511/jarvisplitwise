  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23007aff'/%3E%3Ccircle cx='26' cy='32' r='13' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='40' cy='32' r='13' fill='none' stroke='white' stroke-width='4' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23007aff'/%3E%3Ccircle cx='26' cy='32' r='13' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='40' cy='32' r='13' fill='none' stroke='white' stroke-width='4' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=20260624f" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- GSAP 3.15 (本機自帶) — iOS 質感動態 -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/CustomEase.min.js"></script>
  <script src="js/vendor/InertiaPlugin.min.js"></script>
  <script src="js/vendor/Draggable.min.js"></script>
  <script src="js/vendor/SplitText.min.js"></script>
</head>
<body>
  <!-- iOS 26 liquid glass: SVG feDisplacementMap 模擬鏡頭折射 (用於玻璃元件的 backdrop-filter) -->
  <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
    <filter id="liquid-glass" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.0055" numOctaves="2" seed="42" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.4" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="48" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <main id="app"></main>
  <script type="module" src="js/app.js?v=20260624f"></script>
</body>
</html>
